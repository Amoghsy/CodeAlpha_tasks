<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile • Vibesta</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-zinc-50 min-h-screen pb-16 sm:pb-8">

  <!-- Top Navbar Component Injection -->
  <div id="navbar-container"></div>

  <!-- Edit Profile Container -->
  <main class="max-w-xl mx-auto px-4 sm:px-6 pt-6 sm:pt-8">
    
    <div class="bg-white border border-zinc-200/90 rounded-2xl overflow-hidden shadow-sm">
      
      <!-- Card Header -->
      <div class="px-6 py-4 border-b border-zinc-200 flex items-center justify-between">
        <h2 class="text-base font-bold text-zinc-900">Edit profile</h2>
        <a href="profile.html" class="text-xs text-zinc-400 hover:text-zinc-700">Cancel</a>
      </div>

      <!-- Edit Form -->
      <form id="edit-profile-form" class="p-6 space-y-6">
        
        <!-- Avatar Change Section -->
        <div class="flex items-center gap-5 p-4 bg-zinc-50 rounded-2xl border border-zinc-100">
          <img 
            id="edit-avatar-preview" 
            src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" 
            alt="Current avatar" 
            class="w-16 h-16 rounded-full object-cover border border-zinc-200 shadow-sm"
          />
          <div>
            <label 
              for="edit-avatar-input" 
              class="cursor-pointer text-xs font-bold text-blue-600 hover:text-blue-700 block"
            >
              Change profile photo
            </label>
            <input type="file" id="edit-avatar-input" accept="image/*" class="hidden">
            <span class="text-[11px] text-zinc-400">JPG, PNG or GIF, max 5MB</span>
          </div>
        </div>

        <!-- Full Name -->
        <div class="space-y-1.5">
          <label for="edit-name-input" class="text-xs font-bold text-zinc-700">Name</label>
          <input 
            type="text" 
            id="edit-name-input" 
            placeholder="Your full name" 
            class="w-full px-3.5 py-2.5 bg-zinc-50 focus:bg-white text-xs text-zinc-900 rounded-xl border border-zinc-200 focus:border-zinc-400 focus:outline-none transition-colors"
          />
          <p class="text-[10px] text-zinc-400">Help people discover your account using the name you're known by.</p>
        </div>

        <!-- Username -->
        <div class="space-y-1.5">
          <label for="edit-username-input" class="text-xs font-bold text-zinc-700">Username</label>
          <input 
            type="text" 
            id="edit-username-input" 
            placeholder="Username" 
            required
            class="w-full px-3.5 py-2.5 bg-zinc-50 focus:bg-white text-xs text-zinc-900 rounded-xl border border-zinc-200 focus:border-zinc-400 focus:outline-none transition-colors"
          />
        </div>

        <!-- Bio -->
        <div class="space-y-1.5">
          <label for="edit-bio-input" class="text-xs font-bold text-zinc-700">Bio</label>
          <textarea 
            id="edit-bio-input" 
            rows="3" 
            placeholder="Tell your story, interests, or links..." 
            class="w-full p-3 bg-zinc-50 focus:bg-white text-xs text-zinc-900 rounded-xl border border-zinc-200 focus:border-zinc-400 focus:outline-none resize-none transition-colors"
          ></textarea>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button 
            type="submit" 
            id="edit-save-btn" 
            class="w-full py-2.5 rounded-xl font-semibold text-xs text-white brand-gradient-bg hover:opacity-95 active:scale-[0.99] transition-all shadow-md shadow-pink-500/20 disabled:opacity-50"
          >
            Save Changes
          </button>
        </div>

      </form>
    </div>

  </main>

  <!-- Mobile Bottom Navigation Bar Injection -->
  <div id="mobile-bottom-bar"></div>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/upload.js"></script>
</body>
</html>
