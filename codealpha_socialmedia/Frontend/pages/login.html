<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login • Vibesta</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-zinc-50 min-h-screen flex flex-col justify-between items-center px-4 py-8">
  
  <main class="w-full max-w-sm my-auto space-y-3">
    <!-- Main Login Card -->
    <div class="bg-white border border-zinc-200/90 rounded-2xl p-8 shadow-sm">
      
      <!-- Brand Header -->
      <div class="text-center mb-7">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl brand-gradient-bg mb-3 p-1 shadow-md shadow-pink-500/20">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <rect x="2" y="2" width="20" height="20" rx="6" stroke-width="2"/>
            <circle cx="12" cy="12" r="4" stroke-width="2"/>
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor"/>
          </svg>
        </div>
        <h1 class="text-3xl font-extrabold tracking-tight brand-gradient-text">Vibesta</h1>
        <p class="text-xs text-zinc-500 mt-1">Capture, share, and vibe together.</p>
      </div>

      <!-- Inline Error Banner -->
      <div id="auth-error" class="hidden mb-4 p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-600 font-medium"></div>

      <!-- Login Form -->
      <form id="login-form" class="space-y-3">
        <div>
          <input 
            type="text" 
            id="identifier" 
            placeholder="Username or email" 
            required
            class="w-full px-3.5 py-2.5 bg-zinc-50 focus:bg-white text-xs text-zinc-900 rounded-xl border border-zinc-200 focus:border-zinc-400 focus:outline-none transition-colors"
          />
        </div>

        <div class="relative">
          <input 
            type="password" 
            id="password" 
            placeholder="Password" 
            required
            class="w-full px-3.5 py-2.5 bg-zinc-50 focus:bg-white text-xs text-zinc-900 rounded-xl border border-zinc-200 focus:border-zinc-400 focus:outline-none transition-colors pr-10"
          />
          <button 
            type="button" 
            id="toggle-password-btn" 
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-xs text-zinc-400 hover:text-zinc-700 select-none"
            onclick="const p = document.getElementById('password'); p.type = p.type === 'password' ? 'text' : 'password'; this.textContent = p.type === 'password' ? 'Show' : 'Hide';"
          >
            Show
          </button>
        </div>

        <button 
          type="submit" 
          id="login-submit-btn" 
          class="w-full py-2.5 rounded-xl font-semibold text-xs text-white brand-gradient-bg hover:opacity-95 active:scale-[0.99] transition-all shadow-md shadow-pink-500/20 disabled:opacity-50"
        >
          Log In
        </button>
      </form>

      <!-- Divider -->
      <div class="flex items-center my-5">
        <div class="flex-1 border-t border-zinc-200"></div>
        <span class="px-3 text-[11px] font-bold text-zinc-400 uppercase tracking-wider">OR</span>
        <div class="flex-1 border-t border-zinc-200"></div>
      </div>

      <!-- Demo One-Click Login -->
      <div class="text-center">
        <button 
          type="button" 
          id="demo-login-btn" 
          class="text-xs font-semibold text-blue-600 hover:text-blue-800 transition-colors"
          onclick="document.getElementById('identifier').value = 'creator@vibesta.com'; document.getElementById('password').value = 'password123'; document.getElementById('login-form').dispatchEvent(new Event('submit'));"
        >
          🚀 Fill with Demo Credentials
        </button>
      </div>
    </div>

    <!-- Sign Up Redirect Card -->
    <div class="bg-white border border-zinc-200/90 rounded-2xl p-5 text-center text-xs text-zinc-600 shadow-sm">
      Don't have an account? 
      <a href="register.html" class="font-bold text-blue-600 hover:text-blue-800 ml-1">Sign up</a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center text-[11px] text-zinc-400 py-4">
    <p>© 2026 Vibesta Social • Built with CodeAlpha</p>
  </footer>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
