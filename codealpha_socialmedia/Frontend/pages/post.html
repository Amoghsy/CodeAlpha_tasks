<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibesta • Post Detail</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-zinc-50 min-h-screen pb-16 sm:pb-8">

  <!-- Top Navbar Component Injection -->
  <div id="navbar-container"></div>

  <!-- Post Detail Content Container -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 pt-6 sm:pt-8">
    
    <!-- Back to Feed Link -->
    <div class="mb-4">
      <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-bold text-zinc-600 hover:text-black transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Back to Feed
      </a>
    </div>

    <!-- Post Detail Component Host -->
    <div id="post-detail-container">
      <div class="bg-white border border-zinc-200 rounded-2xl p-12 text-center">
        <div class="w-8 h-8 mx-auto border-2 border-zinc-300 border-t-pink-500 rounded-full animate-spin"></div>
        <p class="text-xs text-zinc-400 mt-3">Loading post details...</p>
      </div>
    </div>

  </main>

  <!-- Mobile Bottom Navigation Bar Injection -->
  <div id="mobile-bottom-bar"></div>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/post.js"></script>
</body>
</html>
