<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibesta • Profile</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-zinc-50 min-h-screen pb-16 sm:pb-8">

  <!-- Top Navbar Component Injection -->
  <div id="navbar-container"></div>

  <!-- Profile Content Container -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 pt-8">
    
    <!-- User Profile Header & Stats -->
    <header id="profile-header-container" class="bg-white border border-zinc-200/90 rounded-2xl p-6 sm:p-8 shadow-sm">
      <!-- Rendered by profile.js -->
      <div class="flex items-center gap-6 animate-pulse">
        <div class="w-24 h-24 rounded-full skeleton"></div>
        <div class="space-y-3 flex-1">
          <div class="h-5 w-40 skeleton rounded"></div>
          <div class="h-4 w-60 skeleton rounded"></div>
        </div>
      </div>
    </header>

    <!-- Grid Tabs -->
    <div class="flex items-center justify-center gap-12 border-t border-zinc-200 mt-8 mb-4">
      <button class="flex items-center gap-2 py-3 text-xs font-bold text-zinc-900 border-t-2 border-zinc-900 -mt-[1px] tracking-wider uppercase">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Posts
      </button>
      <button class="flex items-center gap-2 py-3 text-xs font-semibold text-zinc-400 hover:text-zinc-700 tracking-wider uppercase transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
        Saved
      </button>
      <button class="flex items-center gap-2 py-3 text-xs font-semibold text-zinc-400 hover:text-zinc-700 tracking-wider uppercase transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        Tagged
      </button>
    </div>

    <!-- 3-Column Square Thumbnail Grid -->
    <section id="profile-grid-container" class="grid grid-cols-3 gap-1 sm:gap-4 md:gap-6">
      <!-- Rendered by profile.js -->
    </section>

  </main>

  <!-- Mobile Bottom Navigation Bar Injection -->
  <div id="mobile-bottom-bar"></div>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/profile.js"></script>
</body>
</html>
