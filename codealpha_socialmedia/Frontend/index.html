<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibesta</title>
  <script>
    const token = localStorage.getItem('vibesta_token');
    if (token) {
      window.location.replace('pages/index.html');
    } else {
      window.location.replace('pages/login.html');
    }
  </script>
</head>
<body class="bg-zinc-50 flex items-center justify-center min-h-screen">
  <p class="text-sm text-zinc-500 font-sans">Redirecting to Vibesta...</p>
</body>
</html>
