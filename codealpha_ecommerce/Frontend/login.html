<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Login | NovaStore</title>
  <meta name="description" content="Sign in to your NovaStore account to view your orders and track shipments.">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <div class="nav-wrapper">
        <a href="index.html" class="brand-logo">
          <div class="logo-icon"><i class="fas fa-cube"></i></div>
          <span>Nova<span class="accent">Store</span></span>
        </a>

        <div class="nav-actions">
          <a href="index.html" class="nav-link-item"><i class="fas fa-store"></i> Shop</a>
          <a href="register.html" class="btn btn-outline btn-sm">Create Account</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="auth-page-wrap">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Welcome Back</h2>
        <p class="text-muted">Sign in to access your orders and saved cart</p>
      </div>

      <!-- Demo Credentials Helper -->
      <div class="demo-credentials-box">
        <div>
          <strong>Demo User:</strong> alex.mercer@example.com
        </div>
        <button type="button" class="btn btn-outline btn-sm" onclick="fillDemoCredentials()">Auto-fill</button>
      </div>

      <!-- Error Alert Box -->
      <div id="auth-error-alert" style="display: none; background: var(--danger-light); color: var(--danger); padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.88rem; margin-bottom: 1.25rem;">
        <i class="fas fa-exclamation-circle"></i> <span id="auth-error-message">Invalid credentials.</span>
      </div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <div class="input-with-icon">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" id="login-email" class="form-control" placeholder="name@domain.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <label class="form-label" for="login-password">Password</label>
            <a href="#" onclick="showToast('Password reset link sent to email (Demo)', 'info')" style="font-size: 0.8rem; color: var(--primary);">Forgot?</a>
          </div>
          <div class="input-with-icon" style="position: relative;">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" onclick="togglePasswordVisibility('login-password', this)" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-light); cursor: pointer;" aria-label="Toggle password visibility">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; font-size: 0.88rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
            <input type="checkbox" id="remember-me" checked>
            <span>Remember this device</span>
          </label>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block btn-lg">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account yet? <a href="register.html" style="color: var(--primary); font-weight: 600;">Sign up</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border-top: none;">
        <span>&copy; 2026 NovaStore Inc. All rights reserved.</span>
        <a href="index.html" class="text-primary"><i class="fas fa-arrow-left"></i> Return to Store</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/constants.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>

  <script>
    function fillDemoCredentials() {
      document.getElementById('login-email').value = 'alex.mercer@example.com';
      document.getElementById('login-password').value = 'password123';
      hideError();
    }

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fas fa-eye';
      }
    }

    function showError(msg) {
      const alert = document.getElementById('auth-error-alert');
      const text = document.getElementById('auth-error-message');
      text.textContent = msg;
      alert.style.display = 'block';
    }

    function hideError() {
      document.getElementById('auth-error-alert').style.display = 'none';
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      hideError();

      const btn = document.getElementById('login-submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        await auth.login(email, password);
        showToast('Login successful! Redirecting...', 'success');

        const params = new URLSearchParams(window.location.search);
        const returnUrl = params.get('returnUrl');

        setTimeout(() => {
          if (returnUrl) {
            window.location.href = decodeURIComponent(returnUrl);
          } else {
            window.location.href = 'index.html';
          }
        }, 800);
      } catch (err) {
        console.error('Login error:', err);
        showError(err.message || 'Invalid email or password. Please try again.');
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect
      if (auth.isAuthenticated()) {
        const params = new URLSearchParams(window.location.search);
        const returnUrl = params.get('returnUrl');
        window.location.href = returnUrl ? decodeURIComponent(returnUrl) : 'index.html';
      }
    });
  </script>
</body>
</html>
