<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | NovaStore</title>
  <meta name="description" content="Detailed specifications, features, and pricing on NovaStore.">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <div class="nav-wrapper">
        <a href="index.html" class="brand-logo">
          <div class="logo-icon"><i class="fas fa-cube"></i></div>
          <span>Nova<span class="accent">Store</span></span>
        </a>

        <form class="nav-search-form">
          <i class="fas fa-search search-icon"></i>
          <input type="text" name="search" placeholder="Search devices, accessories, audio...">
        </form>

        <div class="nav-actions">
          <a href="index.html" class="nav-link-item nav-desktop-links"><i class="fas fa-store"></i> Shop</a>
          <a href="cart.html" class="nav-cart-btn" aria-label="Shopping Cart">
            <i class="fas fa-shopping-bag"></i>
            <span class="cart-badge" style="display:none;">0</span>
          </a>
          <div id="nav-auth-container"></div>
          <button class="mobile-menu-btn" id="mobile-menu-toggle"><i class="fas fa-bars"></i></button>
        </div>
      </div>
    </div>
  </header>

  <!-- Mobile Drawer Overlay & Nav -->
  <div class="mobile-overlay" id="mobile-overlay"></div>
  <aside class="mobile-drawer" id="mobile-drawer">
    <div class="mobile-drawer-header">
      <a href="index.html" class="brand-logo">
        <div class="logo-icon"><i class="fas fa-cube"></i></div>
        <span>Nova<span class="accent">Store</span></span>
      </a>
      <button class="mobile-drawer-close" id="mobile-drawer-close">&times;</button>
    </div>
    <div class="mobile-nav-links">
      <a href="index.html"><i class="fas fa-store"></i> All Products</a>
      <a href="cart.html"><i class="fas fa-shopping-bag"></i> My Cart</a>
      <a href="orders.html"><i class="fas fa-box"></i> Order History</a>
    </div>
    <div id="mobile-nav-auth-container" style="margin-top: auto; padding-top: 1.5rem;"></div>
  </aside>

  <!-- Main Content -->
  <main class="container">
    <!-- Breadcrumb -->
    <nav class="breadcrumb">
      <a href="index.html"><i class="fas fa-home"></i> Home</a>
      <span>/</span>
      <a href="index.html" id="breadcrumb-category">Products</a>
      <span>/</span>
      <span id="breadcrumb-title" class="text-muted">Loading...</span>
    </nav>

    <!-- Product Details Content -->
    <div id="product-detail-container">
      <!-- Loading Skeleton -->
      <div class="product-detail-grid">
        <div class="skeleton" style="height: 450px; border-radius: var(--radius-md);"></div>
        <div style="display: flex; flex-direction: column; gap: 1rem;">
          <div class="skeleton" style="height: 24px; width: 30%;"></div>
          <div class="skeleton" style="height: 40px; width: 90%;"></div>
          <div class="skeleton" style="height: 20px; width: 45%;"></div>
          <div class="skeleton" style="height: 35px; width: 35%;"></div>
          <div class="skeleton" style="height: 100px; width: 100%;"></div>
          <div class="skeleton" style="height: 50px; width: 60%; margin-top: auto;"></div>
        </div>
      </div>
    </div>

    <!-- Related Products -->
    <section style="margin: 4rem 0 2rem;">
      <h3 style="font-size: 1.5rem; margin-bottom: 1.5rem;">You Might Also Like</h3>
      <div class="product-grid" id="related-products-grid">
        <!-- Injected dynamically -->
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border-top: none;">
        <span>&copy; 2026 NovaStore Inc. All rights reserved.</span>
        <a href="index.html" class="text-primary"><i class="fas fa-arrow-left"></i> Back to Shop</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/constants.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>

  <script>
    let currentProduct = null;
    let selectedQuantity = 1;

    async function loadProductDetails() {
      const container = document.getElementById('product-detail-container');
      const params = new URLSearchParams(window.location.search);
      const productId = params.get('id');

      if (!productId) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon text-danger"><i class="fas fa-exclamation-triangle"></i></div>
            <h3>Product not specified</h3>
            <p class="text-muted" style="margin: 0.5rem 0 1.5rem;">Please select a product from our catalog.</p>
            <a href="index.html" class="btn btn-primary">Browse All Products</a>
          </div>
        `;
        return;
      }

      try {
        const res = await api.getProductById(productId);
        currentProduct = res.data;
        document.title = `${currentProduct.name} | NovaStore`;

        // Update breadcrumb
        document.getElementById('breadcrumb-category').textContent = currentProduct.category.toUpperCase();
        document.getElementById('breadcrumb-category').href = `index.html?category=${currentProduct.category}`;
        document.getElementById('breadcrumb-title').textContent = currentProduct.name;

        renderProductDetails(currentProduct);
        loadRelatedProducts(currentProduct.category, currentProduct.id);
      } catch (err) {
        console.error('Error loading product:', err);
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon text-danger"><i class="fas fa-triangle-exclamation"></i></div>
            <h3>Product not found</h3>
            <p class="text-muted" style="margin: 0.5rem 0 1.5rem;">${err.message || 'We could not find the product you requested.'}</p>
            <a href="index.html" class="btn btn-primary">Return to Shop</a>
          </div>
        `;
      }
    }

    function renderProductDetails(p) {
      const container = document.getElementById('product-detail-container');
      const isOutOfStock = p.stock === 0;
      const gallery = p.gallery && p.gallery.length > 0 ? p.gallery : [p.image];

      container.innerHTML = `
        <div class="product-detail-grid">
          <!-- Gallery Column -->
          <div class="detail-gallery">
            <div class="main-image-wrap">
              <img id="main-product-image" src="${p.image}" alt="${p.name}">
            </div>
            ${gallery.length > 1 ? `
              <div class="thumb-strip">
                ${gallery.map((img, idx) => `
                  <div class="thumb-item ${idx === 0 ? 'active' : ''}" onclick="switchImage('${img}', this)">
                    <img src="${img}" alt="${p.name} preview ${idx + 1}">
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>

          <!-- Information Column -->
          <div class="detail-info">
            <div style="display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem;">
              <span class="badge badge-primary">${p.category}</span>
              ${p.badge ? `<span class="badge badge-dark">${p.badge}</span>` : ''}
              <span class="badge ${isOutOfStock ? 'badge-danger' : (p.stock < 10 ? 'badge-warning' : 'badge-success')}">
                ${isOutOfStock ? 'Out of Stock' : (p.stock < 10 ? `Only ${p.stock} Left` : 'In Stock')}
              </span>
            </div>

            <h1 class="detail-title">${p.name}</h1>

            <div class="detail-meta-row">
              <div class="product-rating" style="font-size: 1rem;">
                <i class="fas fa-star"></i>
                <strong>${p.rating || '4.8'}</strong>
                <span class="text-muted">(${p.reviewsCount || 89} customer reviews)</span>
              </div>
              <span class="text-muted">•</span>
              <span class="text-muted" style="font-size: 0.9rem;">SKU: NOV-${p.id}902</span>
            </div>

            <div class="detail-price-box">
              <span class="detail-price">${formatPrice(p.price)}</span>
              ${p.originalPrice ? `<span class="detail-original-price">${formatPrice(p.originalPrice)}</span>` : ''}
              ${p.originalPrice ? `<span class="badge badge-danger">Save ${formatPrice(p.originalPrice - p.price)}</span>` : ''}
            </div>

            <p class="detail-desc">${p.description}</p>

            ${p.features && p.features.length ? `
              <div style="margin-bottom: 1.5rem;">
                <h4 style="font-size: 1rem; margin-bottom: 0.75rem;">Key Highlights:</h4>
                <ul class="feature-list">
                  ${p.features.map(f => `<li>${f}</li>`).join('')}
                </ul>
              </div>
            ` : ''}

            <!-- Quantity & Actions -->
            ${!isOutOfStock ? `
              <div class="quantity-row">
                <span style="font-weight: 600; font-size: 0.95rem;">Quantity:</span>
                <div class="qty-control">
                  <button class="qty-btn" onclick="modifyQty(-1)" aria-label="Decrease quantity"><i class="fas fa-minus"></i></button>
                  <input type="number" id="qty-input" class="qty-input" value="1" min="1" max="${p.stock || 99}" readonly>
                  <button class="qty-btn" onclick="modifyQty(1)" aria-label="Increase quantity"><i class="fas fa-plus"></i></button>
                </div>
                <span class="text-muted" style="font-size: 0.85rem;">Max ${p.stock} units per order</span>
              </div>

              <div class="action-buttons-row">
                <button class="btn btn-primary btn-lg" style="flex: 1;" onclick="addToCartFromDetail()">
                  <i class="fas fa-cart-plus"></i> Add to Cart
                </button>
                <button class="btn btn-secondary btn-lg" onclick="buyNowFromDetail()">
                  <i class="fas fa-bolt"></i> Buy Now
                </button>
              </div>
            ` : `
              <div style="background: var(--danger-light); padding: 1rem 1.25rem; border-radius: var(--radius-md); color: var(--danger); margin-top: 1rem;">
                <i class="fas fa-bell"></i> Currently unavailable. Check back soon or browse similar items below.
              </div>
            `}
          </div>
        </div>
      `;
    }

    function switchImage(src, element) {
      document.getElementById('main-product-image').src = src;
      document.querySelectorAll('.thumb-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
    }

    function modifyQty(delta) {
      if (!currentProduct) return;
      const input = document.getElementById('qty-input');
      let val = parseInt(input.value, 10) + delta;
      if (val < 1) val = 1;
      if (val > currentProduct.stock) val = currentProduct.stock;
      input.value = val;
      selectedQuantity = val;
    }

    function addToCartFromDetail() {
      if (!currentProduct) return;
      window.cartManager.addItem(currentProduct, selectedQuantity);
    }

    function buyNowFromDetail() {
      if (!currentProduct) return;
      window.cartManager.addItem(currentProduct, selectedQuantity);
      window.location.href = 'checkout.html';
    }

    async function loadRelatedProducts(category, currentId) {
      try {
        const res = await api.getProducts({ category, limit: 4 });
        const related = (res.data || []).filter(item => item.id !== currentId).slice(0, 3);
        const grid = document.getElementById('related-products-grid');
        
        if (related.length === 0) {
          grid.innerHTML = '<p class="text-muted">No other items in this category.</p>';
          return;
        }

        grid.innerHTML = related.map(p => `
          <div class="product-card">
            <a href="product.html?id=${p.id}" class="product-image-wrap">
              <img src="${p.image}" alt="${p.name}">
            </a>
            <div class="product-body">
              <span class="product-cat">${p.category}</span>
              <h4 class="product-title" style="margin-top: 0.25rem;">
                <a href="product.html?id=${p.id}">${p.name}</a>
              </h4>
              <div class="product-footer" style="margin-top: auto;">
                <span class="product-price">${formatPrice(p.price)}</span>
                <a href="product.html?id=${p.id}" class="btn btn-outline btn-sm">View Item</a>
              </div>
            </div>
          </div>
        `).join('');
      } catch (e) {
        console.warn('Could not load related products', e);
      }
    }

    document.addEventListener('DOMContentLoaded', loadProductDetails);
  </script>
</body>
</html>
