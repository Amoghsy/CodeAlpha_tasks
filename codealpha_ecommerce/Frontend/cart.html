<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | NovaStore</title>
  <meta name="description" content="View items in your shopping cart and calculate total before checkout.">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <div class="nav-wrapper">
        <a href="index.html" class="brand-logo">
          <div class="logo-icon"><i class="fas fa-cube"></i></div>
          <span>Nova<span class="accent">Store</span></span>
        </a>

        <form class="nav-search-form">
          <i class="fas fa-search search-icon"></i>
          <input type="text" name="search" placeholder="Search devices, accessories, audio...">
        </form>

        <div class="nav-actions">
          <a href="index.html" class="nav-link-item nav-desktop-links"><i class="fas fa-store"></i> Shop</a>
          <a href="cart.html" class="nav-cart-btn active" aria-label="Shopping Cart">
            <i class="fas fa-shopping-bag"></i>
            <span class="cart-badge" style="display:none;">0</span>
          </a>
          <div id="nav-auth-container"></div>
          <button class="mobile-menu-btn" id="mobile-menu-toggle"><i class="fas fa-bars"></i></button>
        </div>
      </div>
    </div>
  </header>

  <!-- Mobile Drawer Overlay & Nav -->
  <div class="mobile-overlay" id="mobile-overlay"></div>
  <aside class="mobile-drawer" id="mobile-drawer">
    <div class="mobile-drawer-header">
      <a href="index.html" class="brand-logo">
        <div class="logo-icon"><i class="fas fa-cube"></i></div>
        <span>Nova<span class="accent">Store</span></span>
      </a>
      <button class="mobile-drawer-close" id="mobile-drawer-close">&times;</button>
    </div>
    <div class="mobile-nav-links">
      <a href="index.html"><i class="fas fa-store"></i> All Products</a>
      <a href="cart.html" class="active"><i class="fas fa-shopping-bag"></i> My Cart</a>
      <a href="orders.html"><i class="fas fa-box"></i> Order History</a>
    </div>
    <div id="mobile-nav-auth-container" style="margin-top: auto; padding-top: 1.5rem;"></div>
  </aside>

  <!-- Main Content -->
  <main class="container">
    <div style="margin: 2rem 0 1rem; display: flex; justify-content: space-between; align-items: baseline;">
      <h1 style="font-size: 1.85rem;">Shopping Cart</h1>
      <span id="cart-item-count-text" class="text-muted">0 items</span>
    </div>

    <div id="cart-view-container">
      <!-- Injected dynamically based on cart state -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border-top: none;">
        <span>&copy; 2026 NovaStore Inc. All rights reserved.</span>
        <a href="index.html" class="text-primary"><i class="fas fa-arrow-left"></i> Continue Shopping</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/constants.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>

  <script>
    async function renderCartPage() {
      const container = document.getElementById('cart-view-container');
      const items = window.cartManager.getItems();
      const summary = await window.cartManager.refreshSummary();
      const countEl = document.getElementById('cart-item-count-text');

      if (countEl) {
        countEl.textContent = `${summary.itemCount} item${summary.itemCount !== 1 ? 's' : ''}`;
      }

      if (!items || items.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon"><i class="fas fa-cart-arrow-down"></i></div>
            <h2>Your cart is empty</h2>
            <p class="text-muted" style="margin: 0.75rem auto 1.75rem; max-width: 420px;">
              Looks like you haven't added any products to your bag yet. Explore our curated catalog and find your next favorite tech gear!
            </p>
            <a href="index.html" class="btn btn-primary btn-lg">
              <i class="fas fa-shopping-bag"></i> Start Shopping Now
            </a>
          </div>
        `;
        return;
      }

      // Free shipping threshold banner
      let shippingBanner = '';
      if (summary.freeShippingThresholdRemaining > 0 && !summary.promo?.freeShipping) {
        shippingBanner = `
          <div style="background: var(--primary-light); color: var(--primary); padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.88rem; font-weight: 600; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.5rem;">
            <i class="fas fa-truck"></i> Add <strong>${formatPrice(summary.freeShippingThresholdRemaining)}</strong> more to get <strong>FREE standard delivery!</strong>
          </div>
        `;
      } else {
        shippingBanner = `
          <div style="background: var(--accent-light); color: var(--accent); padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.88rem; font-weight: 600; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.5rem;">
            <i class="fas fa-check-circle"></i> Congratulations! You've unlocked <strong>FREE standard shipping!</strong>
          </div>
        `;
      }

      container.innerHTML = `
        ${shippingBanner}
        <div class="cart-layout">
          <!-- Items List Card -->
          <div class="cart-table-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border);">
              <h3 style="font-size: 1.15rem;">Review Items (${items.length})</h3>
              <button class="btn btn-outline btn-sm text-danger" onclick="confirmClearCart()">
                <i class="fas fa-trash-alt"></i> Clear Cart
              </button>
            </div>

            <div class="cart-items-list">
              ${items.map(item => `
                <div class="cart-item-row" id="cart-item-${item.id}">
                  <div class="cart-item-thumb">
                    <img src="${item.image}" alt="${item.name}">
                  </div>
                  
                  <div class="cart-item-info">
                    <h4><a href="product.html?id=${item.id}">${item.name}</a></h4>
                    <span class="item-price">${formatPrice(item.price)} each</span>
                  </div>

                  <div class="qty-control">
                    <button class="qty-btn" onclick="updateItemQty(${item.id}, ${item.quantity - 1})" aria-label="Reduce qty"><i class="fas fa-minus"></i></button>
                    <input type="number" class="qty-input" value="${item.quantity}" min="1" max="${item.stock || 99}" onchange="updateItemQty(${item.id}, this.value)">
                    <button class="qty-btn" onclick="updateItemQty(${item.id}, ${item.quantity + 1})" aria-label="Increase qty"><i class="fas fa-plus"></i></button>
                  </div>

                  <div class="cart-item-subtotal">
                    ${formatPrice(item.price * item.quantity)}
                  </div>

                  <button class="btn-remove-item" onclick="removeItemFromCart(${item.id})" title="Remove item" aria-label="Remove item">
                    <i class="fas fa-times"></i>
                  </button>
                </div>
              `).join('')}
            </div>

            <div style="margin-top: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
              <a href="index.html" class="btn btn-outline btn-sm">
                <i class="fas fa-arrow-left"></i> Continue Shopping
              </a>
            </div>
          </div>

          <!-- Order Summary Card -->
          <div class="summary-card">
            <h3 class="summary-title">Order Summary</h3>

            <div class="summary-line">
              <span>Items Subtotal</span>
              <span>${formatPrice(summary.subtotal)}</span>
            </div>

            ${summary.discount > 0 ? `
              <div class="summary-line" style="color: var(--accent);">
                <span>Discount (${summary.promo?.label || 'Promo'})</span>
                <span>-${formatPrice(summary.discount)}</span>
              </div>
            ` : ''}

            <div class="summary-line">
              <span>Estimated Shipping</span>
              <span>${summary.shipping === 0 ? '<strong class="text-success">FREE</strong>' : formatPrice(summary.shipping)}</span>
            </div>

            <div class="summary-line">
              <span>Estimated Tax (8%)</span>
              <span>${formatPrice(summary.tax)}</span>
            </div>

            <div class="summary-line total-line">
              <span>Total</span>
              <span>${formatPrice(summary.total)}</span>
            </div>

            <!-- Promo Code Box -->
            <div style="margin-top: 1.5rem;">
              <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">Promo Code</label>
              ${summary.promo ? `
                <div style="display: flex; justify-content: space-between; align-items: center; background: var(--accent-light); border: 1px dashed var(--accent); padding: 0.5rem 0.75rem; border-radius: var(--radius-md); font-size: 0.88rem;">
                  <div>
                    <strong style="color: var(--accent);">${summary.promo.code}</strong> (${summary.promo.label})
                  </div>
                  <button class="btn-remove-item" onclick="removePromo()" title="Remove code"><i class="fas fa-times"></i></button>
                </div>
              ` : `
                <form class="promo-form" onsubmit="handleApplyPromo(event)">
                  <input type="text" id="promo-code-input" class="form-control" placeholder="e.g. SAVE10 or ALPHA20" style="text-transform: uppercase;">
                  <button type="submit" class="btn btn-secondary">Apply</button>
                </form>
                <small class="text-muted" style="display: block; font-size: 0.78rem;">Try: <code>SAVE10</code> (10% off) or <code>FREESHIP</code></small>
              `}
            </div>

            <div style="margin-top: 2rem;">
              <a href="checkout.html" class="btn btn-primary btn-block btn-lg" style="box-shadow: 0 4px 15px var(--primary-glow);">
                Proceed to Checkout <i class="fas fa-arrow-right"></i>
              </a>
            </div>

            <div style="margin-top: 1.25rem; text-align: center; font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
              <i class="fas fa-shield-alt text-success"></i> 256-bit Encrypted Checkout
            </div>
          </div>
        </div>
      `;
    }

    function updateItemQty(productId, newQty) {
      window.cartManager.updateQuantity(productId, newQty);
      renderCartPage();
    }

    function removeItemFromCart(productId) {
      window.cartManager.removeItem(productId);
      renderCartPage();
    }

    function confirmClearCart() {
      if (confirm('Are you sure you want to empty your entire shopping cart?')) {
        window.cartManager.clearCart();
        renderCartPage();
      }
    }

    async function handleApplyPromo(e) {
      e.preventDefault();
      const input = document.getElementById('promo-code-input');
      const code = input ? input.value.trim() : '';
      if (!code) return;

      const res = await window.cartManager.applyPromoCode(code);
      if (res.success) {
        showToast(`Promo code "${code.toUpperCase()}" applied!`, 'success');
      } else {
        showToast(res.message || 'Invalid promo code.', 'warning');
      }
      renderCartPage();
    }

    async function removePromo() {
      await window.cartManager.removePromoCode();
      showToast('Promo code removed', 'info');
      renderCartPage();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderCartPage();
      window.addEventListener('cartUpdated', renderCartPage);
    });
  </script>
</body>
</html>
